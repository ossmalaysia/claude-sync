name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege: jobs only read the repository unless they say otherwise.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: claude-sync-macos
          - os: windows-latest
            platform: windows/amd64
            artifact: claude-sync-windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install Wails CLI (same version as go.mod)
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
      - name: Frontend tests
        working-directory: frontend
        run: npm ci && npm test
      - name: Go tests
        run: go test ./...
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis -y
      - name: Build
        env:
          # the tag for a release, otherwise dev-<commit>; passed via env, not interpolated into the script
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.sha) }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            wails build -platform ${{ matrix.platform }} -clean -nsis -ldflags "-X github.com/ossmalaysia/claude-sync/internal/app.Version=${VERSION}"
          else
            wails build -platform ${{ matrix.platform }} -clean -ldflags "-X github.com/ossmalaysia/claude-sync/internal/app.Version=${VERSION}"
            hdiutil create -volname "Claude Sync" -srcfolder "build/bin/Claude Sync.app" -ov -format UDZO "build/bin/Claude Sync.dmg"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/bin/*.dmg
            build/bin/*.exe

  # A v* tag builds the apps above, then puts them on a DRAFT release. A
  # maintainer reviews the draft and publishes it by hand.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir out
          cp "dist/claude-sync-macos/Claude Sync.dmg" out/Claude-Sync-macOS.dmg
          cp dist/claude-sync-windows/*installer*.exe out/Claude-Sync-Windows-installer.exe
          cp "dist/claude-sync-windows/Claude Sync.exe" out/Claude-Sync-Windows.exe
          (cd out && sha256sum * > SHA256SUMS.txt)
          gh release create "$TAG" out/* --draft --prerelease --title "Claude Sync $TAG" --notes-file .github/release-notes.md
